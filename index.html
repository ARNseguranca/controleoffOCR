    <script>
        // ========== VARIÁVEIS GLOBAIS ==========
        let videoStream = null;
        let capturedPhoto = null;
        let currentFacingMode = 'user';
        let detectedPlate = null;
        let residentsData = [];
        let visitorsData = [];
        
        // Cache
        const CACHE_DURATION = 30000; // 30 segundos
        let cacheVisitors = { data: null, timestamp: 0 };
        let cacheResidents = { data: null, timestamp: 0 };
        
        let config = JSON.parse(localStorage.getItem('zecure_config')) || {
            webAppUrl: '',
            apiPassword: '',
            username: 'admin',
            password: 'zecure2024'
        };

        let isAuthenticated = sessionStorage.getItem('zecure_auth') === 'true';
        let useLocalStorage = !config.webAppUrl || !config.apiPassword;

        // ========== INICIALIZAÇÃO ==========
        document.addEventListener('DOMContentLoaded', function() {
            initCamera();
            setupCPFMask();
            loadData();
            updateSyncStatus();
        });

        // ========== VALIDAÇÃO DE CPF ==========
        function validarCPF(cpf) {
            cpf = cpf.replace(/[^\d]/g, '');
            
            if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) {
                return false;
            }
            
            let soma = 0;
            for (let i = 0; i < 9; i++) {
                soma += parseInt(cpf.charAt(i)) * (10 - i);
            }
            let resto = 11 - (soma % 11);
            let digito1 = resto >= 10 ? 0 : resto;
            
            if (digito1 !== parseInt(cpf.charAt(9))) {
                return false;
            }
            
            soma = 0;
            for (let i = 0; i < 10; i++) {
                soma += parseInt(cpf.charAt(i)) * (11 - i);
            }
            resto = 11 - (soma % 11);
            let digito2 = resto >= 10 ? 0 : resto;
            
            return digito2 === parseInt(cpf.charAt(10));
        }

        // ========== STORAGE (LOCAL OU API) ==========
        function loadData() {
            if (useLocalStorage) {
                visitorsData = JSON.parse(localStorage.getItem('zecure_visitors')) || [];
                residentsData = JSON.parse(localStorage.getItem('zecure_residents')) || [
                    {nome: 'João Silva', endereco: 'Rua A, 123'},
                    {nome: 'Maria Santos', endereco: 'Av. B, 456'}
                ];
                updateStats();
            } else {
                loadVisitorsFromAPI();
                loadResidentsFromAPI();
            }
        }

        function saveVisitorsLocal() {
            localStorage.setItem('zecure_visitors', JSON.stringify(visitorsData));
        }

        function updateSyncStatus() {
            const status = document.getElementById('syncStatus');
            const modeStatus = document.getElementById('modeStatus');
            const modeDescription = document.getElementById('modeDescription');
            
            if (useLocalStorage) {
                status.classList.remove('online');
                status.querySelector('span').textContent = 'Local';
                
                if (modeStatus) {
                    modeStatus.textContent = '💾 Modo Local (LocalStorage)';
                    modeDescription.textContent = 'Os dados estão sendo salvos apenas no navegador. Configure a API para sincronizar com Google Sheets.';
                }
            } else {
                status.classList.add('online');
                status.querySelector('span').textContent = 'Online';
                
                if (modeStatus) {
                    modeStatus.textContent = '☁️ Modo Online (Google Sheets)';
                    modeDescription.textContent = 'Os dados estão sincronizados com Google Sheets em tempo real.';
                }
            }
        }

        // ========== API (COM RETRY) ==========
        async function chamarAPI(action, data, tentativa = 0) {
            const MAX_TENTATIVAS = 0;
            
            if (useLocalStorage) {
                throw new Error('API não configurada. Configure na aba Config.');
            }

            try {
                const params = new URLSearchParams({
                    action: action,
                    senha: config.apiPassword,
                    _: Date.now()
                });
                
                if (data) {
                    params.append('data', JSON.stringify(data));
                }
                
                const url = config.webAppUrl + '?' + params.toString();
                
                const response = await fetch(url, {
                    method: 'GET',
                    cache: 'no-cache',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const text = await response.text();
                
                try {
                    const result = JSON.parse(text);
                    
                    if (!result.success) {
                        throw new Error(result.error || 'Erro na API');
                    }
                    
                    return result;
                } catch (parseError) {
                    console.error('Erro ao parsear JSON:', text);
                    throw new Error('Resposta inválida da API. Verifique se o Apps Script está configurado corretamente.');
                }
                
            } catch (error) {
                console.error(`Tentativa ${tentativa}/${MAX_TENTATIVAS} falhou:`, error);
                
                if (tentativa < MAX_TENTATIVAS) {
                    showLoading(`Tentando novamente (${tentativa + 1}/${MAX_TENTATIVAS})...`);
                    await new Promise(resolve => setTimeout(resolve, 1000 * tentativa));
                    return chamarAPI(action, data, tentativa + 1);
                }
                
                throw error;
            }
        }

        async function loadResidentsFromAPI() {
            const now = Date.now();
            if (cacheResidents.data && (now - cacheResidents.timestamp) < CACHE_DURATION) {
                residentsData = cacheResidents.data;
                return;
            }
            
            try {
                const result = await chamarAPI('listarResidentes');
                residentsData = result.data || [];
                cacheResidents = { data: residentsData, timestamp: now };
            } catch (error) {
                console.error('Erro ao carregar residentes:', error);
                alert('⚠️ Erro ao carregar residentes: ' + error.message);
            }
        }

        async function loadVisitorsFromAPI() {
            const now = Date.now();
            if (cacheVisitors.data && (now - cacheVisitors.timestamp) < CACHE_DURATION) {
                visitorsData = cacheVisitors.data;
                updateStats();
                return;
            }
            
            try {
                const result = await chamarAPI('listarTodos');
                visitorsData = result.data || [];
                cacheVisitors = { data: visitorsData, timestamp: now };
                updateStats();
            } catch (error) {
                console.error('Erro ao carregar visitantes:', error);
            }
        }

        // ========== NAVEGAÇÃO ==========
        function showScreen(screen) {
            document.querySelectorAll('.screen').forEach(function(s) {
                s.classList.remove('active');
            });
            document.querySelectorAll('.nav-item').forEach(function(n) {
                n.classList.remove('active');
            });
            
            const screens = {
                'cadastro': 'cadastroScreen',
                'saida': 'saidaScreen',
                'relatorio': 'relatorioScreen',
                'config': 'configScreen'
            };
            
            document.getElementById(screens[screen]).classList.add('active');
            event.target.closest('.nav-item').classList.add('active');
            
            if (screen === 'relatorio') {
                loadReport();
            } else if (screen === 'saida') {
                loadActiveVisitorsForExit();
            } else if (screen === 'config') {
                if (!isAuthenticated) {
                    document.getElementById('loginSection').style.display = 'flex';
                    document.getElementById('configSection').style.display = 'none';
                } else {
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('configSection').style.display = 'block';
                    loadConfigForm();
                }
            }
        }

        // ========== CÂMERA ==========
        async function initCamera() {
            try {
                const video = document.getElementById('video');
                if (videoStream) {
                    videoStream.getTracks().forEach(function(track) {
                        track.stop();
                    });
                }
                videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: currentFacingMode, 
                        width: { ideal: 1920 }, 
                        height: { ideal: 1080 } 
                    } 
                });

        async function capturePlatePhoto() {
            showLoading('Capturando placa...');
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });

                const video = document.createElement('video');
                video.srcObject = stream;
                video.autoplay = true;
                video.playsinline = true;

                await new Promise(function(resolve) {
                    video.onloadedmetadata = function() {
                        video.play();
                        resolve();
                    };
                });

                await new Promise(function(resolve) {
                    setTimeout(resolve, 1000);
                });

                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);

                const processedImage = canvas.toDataURL('image/png');
                document.getElementById('lprPreview').src = processedImage;

                stream.getTracks().forEach(function(track) {
                    track.stop();
                });

                showLoading('Processando OCR...');
                
                const result = await Tesseract.recognize(processedImage, 'eng', {
                    tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'
                });
                
                const text = result.data.text;
                const plateMatch = text.match(/[A-Z]{3}[-\s]?[0-9]{4}|[A-Z]{3}[0-9][A-Z][0-9]{2}/i);
                
                if (plateMatch) {
                    let plate = plateMatch[0].toUpperCase().replace(/[^A-Z0-9]/g, '');
                    if (plate.length === 7) {
                        plate = plate.substring(0, 3) + '-' + plate.substring(3);
                    }
                    detectedPlate = plate;
                    document.getElementById('lprResult').textContent = plate;
                    hideLoading();
                } else {
                    hideLoading();
                    alert('❌ Placa não detectada. Tente novamente ou digite manualmente.');
                }
                
            } catch (error) {
                hideLoading();
                alert('❌ Erro: ' + error.message);
            }
        }

        function downloadPDF() {
            if (visitorsData.length === 0) {
                alert('⚠️ Não há registros para exportar!');
                return;
            }

            showLoading('Gerando PDF...');

            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('p', 'mm', 'a4');

                // Cabeçalho
                doc.setFontSize(16);
                doc.setFont(undefined, 'bold');
                doc.text('ZECURE - Relatório de Visitantes', 14, 15);
                
                doc.setFontSize(9);
                doc.setFont(undefined, 'normal');
                doc.text('Gerado em: ' + new Date().toLocaleString('pt-BR'), 14, 22);
                
                // Estatísticas
                doc.setFontSize(10);
                doc.setFont(undefined, 'bold');
                doc.text('Total de visitantes: ' + visitorsData.length, 14, 30);
                const activeCount = visitorsData.filter(function(v) { return v.status === 'ATIVO'; }).length;
                doc.text('Ativos: ' + activeCount + ' | Saíram: ' + (visitorsData.length - activeCount), 14, 36);

                // Tabela
                const tableData = visitorsData.map(function(v) {
                    return [
                        v.nome,
                        v.cpf,
                        v.tipo,
                        v.placa || '-',
                        v.destino,
                        v.entrada,
                        v.saida || '-',
                        v.status
                    ];
                });

                doc.autoTable({
                    head: [['Nome', 'CPF', 'Tipo', 'Placa', 'Destino', 'Entrada', 'Saída', 'Status']],
                    body: tableData,
                    startY: 42,
                    styles: { 
                        fontSize: 7,
                        cellPadding: 2
                    },
                    headStyles: {
                        fillColor: [76, 119, 153],
                        fontStyle: 'bold'
                    },
                    alternateRowStyles: {
                        fillColor: [245, 245, 245]
                    },
                    columnStyles: {
                        0: { cellWidth: 35 },
                        1: { cellWidth: 25 },
                        2: { cellWidth: 20 },
                        3: { cellWidth: 18 },
                        4: { cellWidth: 35 },
                        5: { cellWidth: 25 },
                        6: { cellWidth: 25 },
                        7: { cellWidth: 15 }
                    }
                });

                // Rodapé
                const pageCount = doc.internal.getNumberOfPages();
                for (let i = 1; i <= pageCount; i++) {
                    doc.setPage(i);
                    doc.setFontSize(8);
                    doc.setFont(undefined, 'normal');
                    doc.text('Página ' + i + ' de ' + pageCount, doc.internal.pageSize.getWidth() / 2, doc.internal.pageSize.getHeight() - 10, { align: 'center' });
                }

                doc.save('zecure-relatorio-' + Date.now() + '.pdf');
                
                hideLoading();
                alert('✅ PDF exportado com sucesso!');
                
            } catch (error) {
                hideLoading();
                console.error('Erro ao gerar PDF:', error);
                alert('❌ Erro ao gerar PDF: ' + error.message);
            }
        }

        async function testConnection() {
            const webAppUrl = document.getElementById('webAppUrl').value;

                alert('⚠️ Preencha a URL e a senha da API!');
                return;
            }

            showLoading('Testando conexão...');

            try {
                const url = webAppUrl + '?action=listarResidentes&senha=' + encodeURIComponent(apiPassword) + '&_=' + Date.now();
                const response = await fetch(url, {
                    method: 'GET',
                    cache: 'no-cache',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                const text = await response.text();
                
                hideLoading();
                
                try {
                    const result = JSON.parse(text);
                    
                    if (result.success) {
                        alert('✅ Conexão bem-sucedida!\n\n' + 
                              'Apps Script está funcionando corretamente.\n' + 
                              'Residentes encontrados: ' + (result.data ? result.data.length : 0));
                    } else {
                        alert('❌ Erro na API: ' + (result.error || 'Falha desconhecida') + '\n\n' +
                              'Verifique:\n' +
                              '1. Senha da API está correta\n' +
                              '2. Apps Script tem as abas corretas no Sheets');
                    }
                } catch (e) {
                    alert('❌ Resposta inválida da API.\n\n' +
                          'Resposta recebida: ' + text.substring(0, 200) + '...\n\n' +
                          'Verifique:\n' +
                          '1. Apps Script está implantado como Web App\n' +
                          '2. Acesso definido como "Qualquer pessoa"\n' +
                          '3. URL está completa e correta');
                }
            } catch (error) {
                hideLoading();
                alert('❌ Erro de conexão:\n\n' + error.message + '\n\n' +
                      'Verifique:\n' +
                      '1. URL está correta e completa\n' +
                      '2. Apps Script está implantado\n' +
                      '3. Você tem conexão com a internet');
            }
        }

                localStorage.setItem('zecure_config', JSON.stringify(config));

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.autocomplete-wrapper')) {
                document.getElementById('autocompleteList').classList.remove('show');
            }
        });

        // ========== SERVICE WORKER (PWA - OPCIONAL) ==========
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                // Descomente para ativar PWA
                // navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</body>
